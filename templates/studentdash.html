<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    {% load static %}

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f7fcf5, #e6f5ea);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .btn-apply {
            padding: 15px 30px;
            font-size: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-apply:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div class="dashboard-container">
    <h1>Student Dashboard</h1>

    <button class="btn-apply"
            onclick="window.location.href='{% url 'apply' %}'">
        Apply Now
    </button>
</div>

</body>
</html>
