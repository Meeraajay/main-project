<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Application Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .form-container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        input, textarea, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn-submit {
            background: green;
            color: white;
            padding: 12px 25px;
            border: none;
        }
    </style>

    <script>
        function validatePreferences() {
            const p1 = document.querySelector('[name="pref1"]').value;
            const p2 = document.querySelector('[name="pref2"]').value;
            const p3 = document.querySelector('[name="pref3"]').value;

            if (p1 === p2 || p1 === p3 || p2 === p3) {
                alert("Choose different preferences");
                return false;
            }
            return true;
        }

        // 🔥 enable/disable subject input
        function toggle(id) {
            const input = document.getElementById(id);
            input.disabled = !input.disabled;

            if (input.disabled) {
                input.value = "";
            }
        }
    </script>

</head>

<body>

<div class="form-container">
    <h1>Student Application</h1>

    <form method="POST" enctype="multipart/form-data" onsubmit="return validatePreferences()">
        {% csrf_token %}

        <div class="form-grid">

            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>

            <input type="date" name="dob" required>

            <textarea name="address" placeholder="Address" class="full-width"></textarea>

            <!-- 🔥 SUBJECT SELECTION -->
            <div class="full-width">
                <h3>Select Subjects & Enter Marks</h3>

                <label><input type="checkbox" onclick="toggle('maths')"> Maths</label>
                <input type="number" id="maths" name="maths" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('physics')"> Physics</label>
                <input type="number" id="physics" name="physics" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('chemistry')"> Chemistry</label>
                <input type="number" id="chemistry" name="chemistry" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('biology')"> Biology</label>
                <input type="number" id="biology" name="biology" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('computer')"> CS</label>
                <input type="number" id="computer" name="computer" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('english')"> English</label>
                <input type="number" id="english" name="english" disabled min="0" max="100"><br>

                <label><input type="checkbox" onclick="toggle('commerce')"> Commerce</label>
                <input type="number" id="commerce" name="commerce" disabled min="0" max="100"><br>
            </div>

            <!-- ❌ REMOVED manual total -->

            <!-- Preferences -->
            <select name="pref1" required>
                <option value="">1st Preference</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Statistics</option>
                <option>Business Studies</option>
                <option>Malayalam</option>
            </select>

            <select name="pref2" required>
                <option value="">2nd Preference</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Statistics</option>
                <option>Business Studies</option>
                <option>Malayalam</option>
            </select>

            <select name="pref3" required class="full-width">
                <option value="">3rd Preference</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Statistics</option>
                <option>Business Studies</option>
                <option>Malayalam</option>
            </select>

            <input type="file" name="certificate" class="full-width" required>

        </div>

        <button type="submit" class="btn-submit">Apply</button>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

    </form>
</div>

</body>
</html>
